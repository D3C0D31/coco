<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Geteilter Grow – AutoPot Grow</title>
<script src="theme-init.js" data-key="autopot-theme"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#main">Zum Inhalt springen</a>
<header class="nav"><div class="wrap nav-in">
  <a class="brand" href="./"><span class="logo" aria-hidden="true">🌱</span><span class="bt">AutoPot Grow</span></a>
  <div class="nav-cta"><button class="btn icon-btn" id="themeBtn" type="button" aria-label="Farbschema wechseln">🌙</button><a class="btn primary" href="app.html">Eigenen Grow starten</a></div>
</div></header>
<main class="wrap sharemain" id="main">
  <div id="shareOut" aria-live="polite"><p class="sub">Lade geteilten Grow …</p></div>
  <details class="faq hidden" id="reportBox"><summary>🚩 Diesen Inhalt melden</summary>
    <form id="reportForm" class="reportform">
      <label for="reportReason">Was ist nicht in Ordnung?</label>
      <textarea id="reportReason" maxlength="300" required placeholder="z. B. beleidigender Inhalt, fremde Fotos, Werbung …"></textarea>
      <button class="btn" type="submit">Meldung senden</button>
      <p class="sub" id="reportMsg" role="status"></p>
    </form>
  </details>
</main>
<footer><div class="wrap foot"><span>Geteilt mit AutoPot Grow · Inhalte stammen von Nutzern</span><nav aria-label="Rechtliches"><a href="nutzungsbedingungen.html">Nutzungsbedingungen</a><a href="datenschutz.html">Datenschutz</a><a href="impressum.html">Impressum</a></nav></div></footer>
<script src="newsfmt.js"></script>
<script src="site.js"></script>
<script src="share.js"></script>
</body>
</html>
